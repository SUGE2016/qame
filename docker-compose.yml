services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      lobby:
        condition: service_healthy
      api-server:
        condition: service_healthy
      admin-console:
        condition: service_healthy
    networks:
      - qame-network
    restart: unless-stopped

  lobby:
    build:
      context: .
      dockerfile: lobby/Dockerfile
      args:
        REACT_APP_SERVER: https://192.168.1.156
        REACT_APP_API_SERVER: https://192.168.1.156
        REACT_APP_PASSWORD_SALT: ${PASSWORD_SALT}
    image: localhost/hqit/qame-frontend:latest
    expose:
      - "3000"
    networks:
      - qame-network
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s

  admin-console:
    build:
      context: .
      dockerfile: admin-console/Dockerfile
      args:
        REACT_APP_API_SERVER: https://192.168.1.156
        REACT_APP_PASSWORD_SALT: ${PASSWORD_SALT}
    image: localhost/hqit/qame-admin-console:latest
    expose:
      - "3001"
    depends_on:
      api-server:
        condition: service_healthy
    networks:
      - qame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3001 || exit 1"]
      interval: 10s
      timeout: 5s

  # Python 平台（替代 Node api-server）
  api-server:
    build:
      context: .
      dockerfile: platform/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: localhost/hqit/qame-platform:latest
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      - PORT=8001
      - DB_HOST=postgres
      - DB_NAME=boardgame_db
      - DB_USER=boardgame_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - PASSWORD_SALT=${PASSWORD_SALT}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AI_SERVICE_TIMEOUT=${AI_SERVICE_TIMEOUT:-30000}
      - GAME_TTT_URL=http://game-tic-tac-toe:8101
      - GAME_GOMOKU_URL=http://game-gomoku:8102
    depends_on:
      postgres:
        condition: service_healthy
      game-tic-tac-toe:
        condition: service_started
      game-gomoku:
        condition: service_started
    networks:
      - qame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  game-tic-tac-toe:
    build:
      context: .
      dockerfile: games/tic-tac-toe/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: localhost/hqit/qame-game-ttt:latest
    expose:
      - "8101"
    networks:
      - qame-network
    restart: unless-stopped

  game-gomoku:
    build:
      context: .
      dockerfile: games/gomoku/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: localhost/hqit/qame-game-gomoku:latest
    expose:
      - "8102"
    networks:
      - qame-network
    restart: unless-stopped

  llm-ai-service:
    build:
      context: ./llm-ai-service
      dockerfile: Dockerfile
    image: localhost/hqit/qame-llm-ai-service:latest
    expose:
      - "3003"
    env_file:
      - .llm-ai-service.env
    environment:
      - NODE_ENV=development
    networks:
      - qame-network
    restart: unless-stopped
    profiles:
      - ai

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=boardgame_db
      - POSTGRES_USER=boardgame_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - qame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardgame_user -d boardgame_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  qame-network:
    driver: bridge
