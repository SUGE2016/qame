services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      lobby:
        condition: service_healthy
      api-server:
        condition: service_healthy
      admin-console:
        condition: service_healthy
    networks:
      - qame-network
    restart: unless-stopped

  lobby:
    build:
      context: .
      dockerfile: lobby/Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        NO_PROXY: "*"
        no_proxy: "*"
        REACT_APP_SERVER: ${PUBLIC_URL:-}
        REACT_APP_API_SERVER: ${PUBLIC_URL:-}
        REACT_APP_PASSWORD_SALT: ${PASSWORD_SALT}
    image: localhost/hqit/qame-frontend:latest
    expose:
      - "3000"
    environment:
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
    networks:
      - qame-network
    depends_on:
      api-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  admin-console:
    build:
      context: .
      dockerfile: admin-console/Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        NO_PROXY: "*"
        no_proxy: "*"
        REACT_APP_API_SERVER: ${PUBLIC_URL:-}
        REACT_APP_PASSWORD_SALT: ${PASSWORD_SALT}
    image: localhost/hqit/qame-admin-console:latest
    expose:
      - "3001"
    environment:
      - NO_PROXY=localhost,127.0.0.1
      - no_proxy=localhost,127.0.0.1
    depends_on:
      api-server:
        condition: service_healthy
    networks:
      - qame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # Python 平台（服务名保留 api-server，兼容 nginx）
  api-server:
    build:
      context: .
      dockerfile: platform/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
    image: localhost/hqit/qame-platform:latest
    ports:
      - "8001:8001"
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      - PORT=8001
      - DB_HOST=postgres
      - DB_NAME=boardgame_db
      - DB_USER=boardgame_user
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_PORT=5432
      - JWT_SECRET=${JWT_SECRET}
      - PASSWORD_SALT=${PASSWORD_SALT}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-}
      - QAME_ENV=${QAME_ENV:-development}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - AI_SERVICE_TIMEOUT=${AI_SERVICE_TIMEOUT:-30000}
      - GAME_TTT_URL=http://game-tic-tac-toe:8101
      - GAME_GOMOKU_URL=http://game-gomoku:8102
      - GAME_BATTLESHIP_URL=http://game-battleship:8103
      # 宿主 Docker 代理勿劫持容器内服务名
      - NO_PROXY=localhost,127.0.0.1,postgres,game-tic-tac-toe,game-gomoku,game-battleship,api-server,qame-network
      - no_proxy=localhost,127.0.0.1,postgres,game-tic-tac-toe,game-gomoku,game-battleship,api-server,qame-network
    depends_on:
      postgres:
        condition: service_healthy
      game-tic-tac-toe:
        condition: service_healthy
      game-gomoku:
        condition: service_healthy
      game-battleship:
        condition: service_healthy
    networks:
      - qame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  game-tic-tac-toe:
    build:
      context: .
      dockerfile: games/tic-tac-toe/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: localhost/hqit/qame-game-ttt:latest
    environment:
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-}
    expose:
      - "8101"
    networks:
      - qame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  game-gomoku:
    build:
      context: .
      dockerfile: games/gomoku/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: localhost/hqit/qame-game-gomoku:latest
    environment:
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-}
    expose:
      - "8102"
    networks:
      - qame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  game-battleship:
    build:
      context: .
      dockerfile: games/battleship/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: localhost/hqit/qame-game-battleship:latest
    environment:
      - INTERNAL_SERVICE_KEY=${INTERNAL_SERVICE_KEY:-}
    expose:
      - "8103"
    networks:
      - qame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  llm-ai-service:
    build:
      context: ./llm-ai-service
      dockerfile: Dockerfile
    image: localhost/hqit/qame-llm-ai-service:latest
    expose:
      - "3003"
    env_file:
      - .llm-ai-service.env
    environment:
      - NODE_ENV=development
    networks:
      - qame-network
    restart: unless-stopped
    profiles:
      - ai

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=boardgame_db
      - POSTGRES_USER=boardgame_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 默认不映射宿主端口，避免与本机 Postgres 冲突
    networks:
      - qame-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardgame_user -d boardgame_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  qame-network:
    driver: bridge
